name: virtuspace
description: VirtuSpace - Smart Collaboration Platform for students, faculty and innovators.

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=2.18.4 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cloud_firestore: ^4.14.0
  cloud_functions: ^4.6.0
  firebase_auth: ^4.16.0
  firebase_core: ^2.24.2
  firebase_storage: ^11.6.0
  firebase_messaging: ^14.7.10
  file_picker: ^5.3.1
  image_picker: ^1.0.2
  flutter_riverpod: ^2.3.7
  uuid: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.2

flutter:
  uses-material-design: true

  assets:
    - assets/